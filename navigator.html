<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans','Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--red:#E30613;--dark-red:#B8050F;--yellow:#FFD100;--black:#1A1A1A;--gray:#F5F5F5;--border:#E0E0E0;--green:#28a745;--dim:#666}
html,body{height:100%;overflow:hidden;background:var(--gray)}

/* ── SCREEN SETUP ── */
#screenSetup{position:fixed;inset:0;background:var(--gray);display:flex;flex-direction:column;overflow-y:auto;z-index:10}

/* Header — stesso stile app driver */
.setup-header{background:#fff;border-top:4px solid var(--yellow);border-bottom:4px solid var(--red);padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.setup-header img{height:36px;border-radius:6px}
.setup-header-title{font-size:1.05rem;font-weight:800;color:var(--black)}
.setup-header-sub{font-size:0.72rem;color:var(--dim);font-weight:500;margin-top:1px}

/* Contenitore centrato (max 480px) come app driver */
.setup-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;max-width:480px;margin:0 auto;width:100%}

/* Card missione — stile .card del driver */
.mission-card{background:white;border-radius:12px;padding:16px 18px;border-left:4px solid var(--red);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.mission-card-title{font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.mission-route{font-size:1rem;font-weight:700;color:var(--black);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mission-arrow{color:var(--yellow);font-size:1.1rem}
.mission-meta{font-size:0.75rem;color:var(--dim);margin-top:4px;font-weight:500}

/* Card destinazione manuale */
.dst-card{background:white;border-radius:12px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.dst-card label{font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:8px}
.dst-input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:10px;font-size:0.95rem;outline:none;transition:border-color .2s;background:#fafafa}
.dst-input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px rgba(227,6,19,.06)}
.dst-suggestions{background:white;border:1px solid var(--border);border-radius:0 0 10px 10px;max-height:160px;overflow-y:auto;display:none;margin-top:-2px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.dst-sugg-item{padding:11px 14px;font-size:0.85rem;cursor:pointer;border-bottom:1px solid var(--border);color:var(--black)}
.dst-sugg-item:hover{background:#fff5f5;color:var(--red)}

/* 3 Itinerari */
.route-label{font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.route-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.route-card{background:white;border:2px solid var(--border);border-radius:12px;padding:12px 7px;cursor:pointer;transition:all .15s;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.route-card:active{transform:scale(.97)}
.route-card.selected{border-color:var(--red);background:#fff5f5;box-shadow:0 2px 12px rgba(227,6,19,.15)}
.route-card.unavail{opacity:.4;pointer-events:none}
.route-card-icon{font-size:1.4rem;margin-bottom:5px}
.route-card-name{font-size:0.72rem;font-weight:800;color:var(--black);text-transform:uppercase;letter-spacing:.5px}
.route-card-km{font-size:1.05rem;font-weight:800;color:var(--black);margin-top:5px}
.route-card-time{font-size:0.72rem;color:var(--dim);margin-top:1px}
.route-card-toll{font-size:0.72rem;font-weight:700;margin-top:4px}
.toll-zero{color:var(--green)}
.toll-cost{color:var(--red)}
.route-card-saving{font-size:0.6rem;background:#e8f5e9;color:var(--green);font-weight:700;padding:2px 6px;border-radius:4px;margin-top:4px;display:inline-block}
.route-card-warn{font-size:0.6rem;color:#e65100;margin-top:2px}
.route-loading{text-align:center;padding:24px;color:var(--dim);font-size:0.85rem;grid-column:1/-1}

/* Bottone principale — stesso .btn-primary del driver */
.btn-start{width:100%;padding:17px;background:var(--red);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px rgba(227,6,19,.3);transition:all .2s}
.btn-start:active{transform:scale(.97);box-shadow:0 2px 6px rgba(227,6,19,.2)}
.btn-start:disabled{background:#ccc;cursor:not-allowed;box-shadow:none}
.btn-back{background:white;border:2px solid var(--border);color:var(--dim);padding:13px;border-radius:10px;font-size:0.85rem;font-weight:600;cursor:pointer;text-align:center;transition:border-color .2s}
.btn-back:hover{border-color:#aaa}

/* ── SCREEN NAV ── */
#screenNav{position:fixed;inset:0;display:none;flex-direction:column;z-index:10}

/* Maneuver banner */
#maneuverBanner{background:#1A1A1A;color:white;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:500;min-height:72px}
.maneuver-arrow{font-size:2rem;flex-shrink:0;min-width:40px;text-align:center}
.maneuver-text{flex:1;min-width:0}
.maneuver-instruction{font-size:0.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maneuver-dist{font-size:0.72rem;color:#aaa;margin-top:2px}
.maneuver-next{font-size:0.68rem;color:#777;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maneuver-eta{text-align:right;flex-shrink:0}
.maneuver-eta-time{font-size:1rem;font-weight:800;color:var(--yellow)}
.maneuver-eta-label{font-size:0.6rem;color:#aaa;text-transform:uppercase;letter-spacing:.5px}

/* Map */
#navMap{flex:1;z-index:100}

/* Footer bar */
#navFooter{background:#1A1A1A;display:flex;align-items:center;padding:8px 12px;gap:8px;flex-shrink:0;z-index:500}
.nav-speed{background:#2a2a2a;border-radius:8px;padding:8px 14px;text-align:center;min-width:64px}
.nav-speed-val{font-size:1.4rem;font-weight:800;color:white;line-height:1}
.nav-speed-unit{font-size:0.6rem;color:#aaa;text-transform:uppercase}
.nav-info{flex:1;text-align:center}
.nav-dist-remain{font-size:0.78rem;font-weight:700;color:white}
.nav-modalita{font-size:0.62rem;color:#888;margin-top:1px}
.nav-reroute-btn{background:#2a2a2a;border:none;color:#aaa;border-radius:8px;padding:8px 10px;font-size:0.7rem;font-weight:700;cursor:pointer}
.nav-stop-btn{background:var(--red);border:none;color:white;border-radius:8px;padding:8px 14px;font-size:0.75rem;font-weight:700;cursor:pointer}

/* Spinner overlay */
#spinner{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:12px}
#spinner.show{display:flex}
.spinner-text{color:white;font-size:0.88rem;font-weight:600}
.spinner-ring{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:white;padding:10px 18px;border-radius:20px;font-size:0.82rem;font-weight:600;z-index:2000;display:none;white-space:nowrap;border:1px solid var(--red)}
#toast.show{display:block}

/* Truck marker */
.truck-icon-wrap{background:var(--red);border-radius:50%;border:2px solid white;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(227,6,19,.5)}
</style>
</head>
<body>

<!-- SPINNER -->
<div id="spinner"><div class="spinner-ring"></div><div class="spinner-text" id="spinnerText">Caricamento...</div></div>
<div id="toast"></div>

<!-- SCREEN SETUP -->
<div id="screenSetup">
  <div class="setup-header">
    <img src="logo.jpg" alt="Ibersilos" onerror="this.style.display='none'" style="height:48px">
    <div class="setup-header-title">Truck Navigator</div>
  </div>
  <div class="setup-body">

    <!-- Info missione -->
    <div id="missionCard" style="display:none" class="mission-card">
      <div class="mission-card-title">Missione corrente</div>
      <div class="mission-route" id="missionRoute">—</div>

      <div id="missionDstConfirm" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px">Conferma destinazione</div>

    <!-- Destinazione manuale — visibile SOLO senza missione -->

      <input type="text" id="dstInputManuale" class="dst-input" placeholder="Cerca indirizzo o città..." autocomplete="off" oninput="onDstInputManuale()">

    <!-- 3 Itinerari -->

      <div class="route-loading" style="grid-column:1/-1">Inserisci destinazione per calcolare i percorsi</div>
    </div>

    <button class="btn-start" id="btnStart" onclick="iniziaNavigazione()" disabled>INIZIA NAVIGAZIONE</button>

</div>

<!-- SCREEN NAVIGAZIONE -->
<div id="screenNav">
  <div id="maneuverBanner">
    <div class="maneuver-arrow" id="maneuverArrow">↑</div>
    <div class="maneuver-text">
      <div class="maneuver-instruction" id="maneuverInstruction">Attendere GPS...</div>
      <div class="maneuver-dist" id="maneuverDist"></div>
      <div class="maneuver-next" id="maneuverNext"></div>
    </div>
    <div class="maneuver-eta">
      <div class="maneuver-eta-time" id="etaTime">—</div>
      <div class="maneuver-eta-label">arrivo</div>
    </div>
  </div>
  <div id="navMap"></div>
  <div id="navFooter">
    <div class="nav-speed">
      <div class="nav-speed-val" id="speedVal">0</div>
      <div class="nav-speed-unit">km/h</div>
    </div>
    <div class="nav-info">
      <div class="nav-dist-remain" id="distRemain">—</div>
      <div class="nav-modalita" id="navModalitaLabel"></div>
    </div>
    <button class="nav-reroute-btn" onclick="forzaRicalcolo()">↺ Ricalcola</button>
    <button class="nav-stop-btn" onclick="stopNavigazione()">■ Stop</button>
  </div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────
const FB_CONFIG = {
    apiKey:"AIzaSyDbLEYKeJw0667KPnMKLnwdALK_UB71XtM",
    authDomain:"ibersilos-c6053.firebaseapp.com",
    databaseURL:"https://ibersilos-c6053-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"ibersilos-c6053"
};
firebase.initializeApp(FB_CONFIG);
const _db = firebase.database();
firebase.auth().signInAnonymously().catch(()=>{});

// HERE API key — stessa del DSP/DRV
const HERE_KEY = localStorage.getItem('ibs_here_key') || 'rdr5AX04MNl0ZprBKnNNED8GkI9iKbkAPRSM1k8yhzI';
const HERE_GEO  = 'https://geocode.search.hereapi.com/v1/geocode';
const HERE_AUTO = 'https://autocomplete.search.hereapi.com/v1/autocomplete';
const HERE_ROUTE= 'https://router.hereapi.com/v8/routes';
const AVOID_CH  = 'avoid[areas]=bbox:5.956,45.818,10.492,47.808';

// Profilo veicolo 40t EU — semirimorchio 5 assi
const TRUCK = { grossWeight:40000, weightPerAxle:12000, height:380, length:1650, width:255, axleCount:5, trailerCount:1 };

// ── STATE ────────────────────────────────────────────────────
let _dest = null;          // {lat, lng, label}
let _origin = null;        // {lat, lng}
let _routes = {};          // {veloce, breve, economica} → parsed route data
let _selectedMode = null;  // 'veloce'|'breve'|'economica'
let _activeRoute = null;   // route data in navigazione
let _maneuvers = [];       // flat maneuver list
let _polyCoords = [];      // [[lat,lng],...]
let _curManIdx = 0;
let _watchId = null;
let _navMap = null;
let _truckMarker = null;
let _routeLayer = null;
let _rerouteTimer = null;
let _lastPos = null;
let _announced = new Set();
let _missionId = null;
let _drvKey = null;
let _modalitaLabels = { veloce:'⚡ Veloce', breve:'📏 Breve', economica:'💰 Economica' };
let _acTimer = null;

// ── URL PARAMS ───────────────────────────────────────────────
const _params = new URLSearchParams(location.search);
_drvKey    = _params.get('drvKey') || '';
_missionId = _params.get('missionId') || '';
const _paramDst      = _params.get('dst')      || '';
const _paramDstLabel = _params.get('dstLabel') || '';
const _paramModalita = _params.get('modalita') || '';
const _paramSrc      = _params.get('src')      || '';  // "lat,lng" — posizione iniziale da app

// ── FLEXIBLE POLYLINE DECODER (HERE Flexible Polyline v1) ───
// Formato: vals[0]=versione, vals[1]=precision|(3rdDimType<<4), vals[2+]=coordinate delta
function decodeFlexPoly(enc) {
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    const vals = []; let r = 0, sh = 0;
    for (const ch of enc) {
        const v = CHARS.indexOf(ch);
        if (v < 0) continue;
        r |= (v & 0x1F) << sh;
        if ((v & 0x20) === 0) { vals.push(r); r = 0; sh = 0; } else sh += 5;
    }
    const hdrB    = vals[1] ?? 0;
    const prec    = hdrB & 0xF;
    const dim3    = (hdrB >> 4) & 0x7;
    const factor  = Math.pow(10, prec);
    const step    = dim3 ? 3 : 2;
    const toSig   = u => (u & 1) ? ~(u >> 1) : (u >> 1);
    const coords  = []; let lat = 0, lng = 0;
    for (let i = 2; i + 1 < vals.length; i += step) {
        lat += toSig(vals[i]);
        lng += toSig(vals[i + 1]);
        coords.push([lat / factor, lng / factor]);
    }
    return coords;
}

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener('load', async () => {
    showSpinner('Avvio navigator...');
    if (_paramModalita) _selectedMode = _paramModalita;

    // Posizione iniziale da URL param ?src=lat,lng (da app.js o test desktop)
    if (_paramSrc) {
        const [lat, lng] = _paramSrc.split(',').map(Number);
        if (!isNaN(lat) && !isNaN(lng)) _origin = { lat, lng };
    }

    // GPS: avvia subito watchPosition — non blocca il caricamento
    avviaGPS();

    if (_paramDst) {
        await loadFromParams();
    } else if (_missionId) {
        await loadMission(_missionId);
    } else {
        document.getElementById('dstCard').style.display = '';
    }
    hideSpinner();
});

function avviaGPS() {
    if (!navigator.geolocation) return;
    // Prima fix rapida (rete/WiFi, accetta cache fino a 10 min)
    navigator.geolocation.getCurrentPosition(pos => {
        const prima = !_origin;
        _origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        // Se la destinazione è già pronta e non abbiamo ancora calcolato → avvia ora
        const _hasAnyRoutePrima = Object.values(_routes).some(r => r !== null);
        if (prima && _dest && !_hasAnyRoutePrima) calc3Routes();
    }, () => {}, { enableHighAccuracy: false, timeout: 20000, maximumAge: 600000 });

    // watchPosition ad alta precisione per la navigazione
    _watchId = navigator.geolocation.watchPosition(onGPS,
        () => {}, { enableHighAccuracy: true, maximumAge: 5000 });
}

function _showMissionCard(src, dst, meta) {
    document.getElementById('missionCard').style.display = '';
    document.getElementById('dstCard').style.display = 'none';
    document.getElementById('missionRoute').innerHTML =
        `<span>${esc(src)}</span><span class="mission-arrow">→</span><span>${esc(dst)}</span>`;
    document.getElementById('missionMeta').textContent = meta;
}

function _showDstConfirm(prefill) {
    const el = document.getElementById('missionDstConfirm');
    el.style.display = '';
    document.getElementById('dstInput').value = prefill;
}

async function loadFromParams() {
    const label = _paramDstLabel || _paramDst;   // nome display
    const addr  = _paramDst;                      // indirizzo per geocoding (campo 'to' del DSP)
    const src   = _params.get('src') || 'Posizione corrente';
    const meta  = [_missionId, _selectedMode ? _modalitaLabels[_selectedMode] : ''].filter(Boolean).join(' · ');

    _showMissionCard(src, label, meta);

    showSpinner('Calcolo percorso...');
    const gc = await geocode(addr);
    if (gc) {
        _dest = { ...gc, label };
        await calc3Routes();
    } else {
        // Geocoding fallito: mostra input inline nella card missione, pre-compilato
        _showDstConfirm(label);
        showToast('Conferma la destinazione e cerca');
    }
}

async function loadMission(id) {
    try {
        const snap = await _db.ref('dispatcher/missions').once('value');
        const data = snap.val();
        if (!data) { document.getElementById('dstCard').style.display = ''; return; }
        const lista = Array.isArray(data) ? data : Object.values(data);
        const m = lista.find(x => x && x.id === id);
        if (!m) { document.getElementById('dstCard').style.display = ''; return; }
        const src  = m.fromNome || m.from || 'Partenza';
        const dst  = m.toNome   || m.to   || '—';
        const meta = [m.cargo, m.cliente, m.rottaModalita ? _modalitaLabels[m.rottaModalita] : ''].filter(Boolean).join(' · ');
        _showMissionCard(src, dst, meta);
        if (!_selectedMode) _selectedMode = m.rottaModalita || null;
        const addr = (m.to && m.to !== '—') ? m.to : (m.toNome && m.toNome !== '—' ? m.toNome : '');
        if (addr) {
            showSpinner('Calcolo percorso...');
            const gc = await geocode(addr);
            if (gc) { _dest = gc; await calc3Routes(); }
            else _showDstConfirm(dst);
        } else {
            _showDstConfirm('');
        }
    } catch(e) { console.warn('loadMission:', e); document.getElementById('dstCard').style.display = ''; }
}

// ── GEOCODING ────────────────────────────────────────────────
async function geocode(query) {
    try {
        const r = await fetch(`${HERE_GEO}?apiKey=${HERE_KEY}&q=${encodeURIComponent(query)}&lang=it`);
        const d = await r.json();
        const item = d.items?.[0];
        if (!item) return null;
        return { lat: item.position.lat, lng: item.position.lng, label: item.address?.label || query };
    } catch(e) { return null; }
}

// Autocomplete generico
let _acAbort = null;
function _autocomplete(inputId, suggId, onSelect) {
    const q = document.getElementById(inputId).value.trim();
    const sugg = document.getElementById(suggId);
    _dest = null; _routes = {}; renderRouteCards(); updateBtnStart();
    if (q.length < 3) { sugg.style.display = 'none'; return; }
    clearTimeout(_acTimer);
    _acTimer = setTimeout(async () => {
        try {
            if (_acAbort) _acAbort.abort();
            _acAbort = new AbortController();
            const r = await fetch(`${HERE_AUTO}?apiKey=${HERE_KEY}&q=${encodeURIComponent(q)}&lang=it&limit=5`, { signal: _acAbort.signal });
            const d = await r.json();
            const items = d.items || [];
            sugg.innerHTML = items.map((it, i) =>
                `<div class="dst-sugg-item" onclick="${onSelect}(${i})">${esc(it.address?.label || it.title)}</div>`
            ).join('');
            sugg.style.display = items.length ? '' : 'none';
            sugg._items = items;
        } catch(e) { if (e.name !== 'AbortError') sugg.style.display = 'none'; }
    }, 350);
}

// Input inline nella missionCard (geocoding fallito con missione)
function onDstInput() { _autocomplete('dstInput', 'dstSuggestions', 'selectSuggestion'); }
async function selectSuggestion(i) {
    const sugg = document.getElementById('dstSuggestions');
    const item = (sugg._items || [])[i]; if (!item) return;
    sugg.style.display = 'none';
    const addr = item.address?.label || item.title;
    document.getElementById('dstInput').value = addr;
    showSpinner('Geocodifica...');
    const gc = await geocode(addr);
    hideSpinner();
    if (!gc) { showToast('Indirizzo non trovato'); return; }
    _dest = gc;
    document.getElementById('missionDstConfirm').style.display = 'none';
    await calc3Routes();
}

// Input manuale senza missione (dstCard standalone)
function onDstInputManuale() { _autocomplete('dstInputManuale', 'dstSuggestionsManuale', 'selectSuggestionManuale'); }
async function selectSuggestionManuale(i) {
    const sugg = document.getElementById('dstSuggestionsManuale');
    const item = (sugg._items || [])[i]; if (!item) return;
    sugg.style.display = 'none';
    const addr = item.address?.label || item.title;
    document.getElementById('dstInputManuale').value = addr;
    showSpinner('Geocodifica...');
    const gc = await geocode(addr);
    hideSpinner();
    if (!gc) { showToast('Indirizzo non trovato'); return; }
    _dest = gc;
    await calc3Routes();
}

// ── ROUTING ──────────────────────────────────────────────────
function buildRouteURL(extra) {
    if (!_origin || !_dest) return null;
    const qs = [
        `apiKey=${HERE_KEY}`,
        `transportMode=truck`,
        `origin=${_origin.lat},${_origin.lng}`,
        `destination=${_dest.lat},${_dest.lng}`,
        `return=polyline,actions,summary`,
        `lang=it`,
        AVOID_CH,
        `vehicle[grossWeight]=${TRUCK.grossWeight}`,
        `vehicle[weightPerAxle]=${TRUCK.weightPerAxle}`,
        `vehicle[height]=${TRUCK.height}`,
        `vehicle[length]=${TRUCK.length}`,
        `vehicle[width]=${TRUCK.width}`,
        `vehicle[axleCount]=${TRUCK.axleCount}`,
        `vehicle[trailerCount]=${TRUCK.trailerCount}`,
        ...extra,
    ];
    return HERE_ROUTE + '?' + qs.join('&');
}

async function calc3Routes() {
    if (!_dest) return;
    if (!_origin) {
        document.getElementById('routeCards').innerHTML =
            '<div class="route-loading" style="grid-column:1/-1">⌛ Acquisizione GPS in corso...</div>';
        return;
    }
    showSpinner('Calcolo 3 percorsi truck...');
    try {
        const [rV, rB, rE] = await Promise.allSettled([
            fetch(buildRouteURL(['routingMode=fast'])).then(r => r.json()),
            fetch(buildRouteURL(['routingMode=short'])).then(r => r.json()),
            fetch(buildRouteURL(['routingMode=fast', 'avoid[features]=tollRoad'])).then(r => r.json()),
        ]);
        _routes = {
            veloce:    rV.status === 'fulfilled' ? parseRoute(rV.value.routes?.[0]) : null,
            breve:     rB.status === 'fulfilled' ? parseRoute(rB.value.routes?.[0]) : null,
            economica: rE.status === 'fulfilled' ? parseRoute(rE.value.routes?.[0]) : null,
        };
        renderRouteCards();
        // Feedback errore se TUTTE le rotte sono null
        const allNull = !_routes.veloce && !_routes.breve && !_routes.economica;
        if (allNull) {
            const firstReject = [rV, rB, rE].find(r => r.status === 'rejected');
            let errMsg;
            if (firstReject) {
                errMsg = String(firstReject.reason).slice(0, 80);
            } else {
                // fulfilled ma senza routes → estrai testo errore dalla risposta
                const firstFulfilled = [rV, rB, rE].find(r => r.status === 'fulfilled');
                const notice = firstFulfilled?.value?.notices?.[0] || firstFulfilled?.value?.error;
                errMsg = notice ? (notice.title || notice.message || JSON.stringify(notice)).slice(0, 80) : 'Nessun percorso trovato';
            }
            showToast('Errore HERE: ' + errMsg);
            console.error('HERE API error — URL test:', buildRouteURL(['routingMode=fast']));
            console.error('HERE response V:', rV.status === 'fulfilled' ? rV.value : rV.reason);
        }
        // Seleziona automaticamente
        const def = _selectedMode && _routes[_selectedMode] ? _selectedMode
            : (_routes.veloce && _routes.economica && (_routes.veloce.totPedaggi - _routes.economica.totPedaggi) > 5) ? 'economica'
            : 'veloce';
        selectRoute(def);
    } catch(e) {
        console.warn('calc3Routes:', e);
        showToast('Errore calcolo percorso');
    }
    hideSpinner();
}

function parseRoute(route) {
    if (!route) return null;
    const sections = route.sections || [];
    let totM = 0, totS = 0, pedaggiEur = 0, hasTolls = false;
    const actions = [], polyCoords = [];

    sections.forEach(sec => {
        totM += sec.summary?.length || 0;
        totS += sec.summary?.duration || 0;
        // Pedaggi
        (sec.tolls || []).forEach(t => {
            hasTolls = true;
            for (const f of (t.fares || [])) {
                const p = f.price, cp = f.convertedPrice;
                if (p  && (p.currency  || '').toUpperCase() === 'EUR') { pedaggiEur += parseFloat(p.value  || 0); break; }
                if (cp && (cp.currency || '').toUpperCase() === 'EUR') { pedaggiEur += parseFloat(cp.value || 0); break; }
            }
        });
        if (sec.travelSummary?.hasTolls) hasTolls = true;
        // Polyline
        if (sec.polyline) {
            const pts = decodeFlexPoly(sec.polyline);
            polyCoords.push(...pts);
        }
        // Maneuvers
        (sec.actions || []).forEach(a => {
            actions.push({
                instruction: a.instruction || '',
                action: a.action || 'continue',
                direction: a.direction || '',
                length: a.length || 0,
                duration: a.duration || 0,
            });
        });
    });

    const km = (totM / 1000).toFixed(1);
    const mins = Math.round(totS / 60);
    const tempo = mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}m` : `${mins}m`;
    const totPedaggi = hasTolls ? pedaggiEur : 0;

    return { km, tempo, totPedaggi, hasTolls, actions, polyCoords, _route: route };
}

// ── RENDER CARDS ─────────────────────────────────────────────
function renderRouteCards() {
    const el = document.getElementById('routeCards');
    if (!_routes.veloce && !_routes.breve && !_routes.economica) {
        el.innerHTML = '<div class="route-loading" style="grid-column:1/-1">Inserisci destinazione per calcolare i percorsi</div>';
        return;
    }
    const risparmio = (_routes.veloce && _routes.economica)
        ? Math.max(0, _routes.veloce.totPedaggi - _routes.economica.totPedaggi) : 0;

    function card(id, icon, name, r) {
        if (!r) return `<div class="route-card unavail" data-m="${id}">
            <div class="route-card-icon">${icon}</div>
            <div class="route-card-name">${name}</div>
            <div class="route-card-time" style="margin-top:6px">Non disponibile</div>
        </div>`;
        const tollHtml = r.totPedaggi > 0.01
            ? `<div class="route-card-toll toll-cost">€${r.totPedaggi.toFixed(0)} pedaggi</div>`
            : `<div class="route-card-toll toll-zero">Nessun pedaggio</div>`;
        const savingHtml = id === 'economica' && risparmio > 0.5
            ? `<div class="route-card-saving">Risparmio €${risparmio.toFixed(0)}</div>` : '';
        return `<div class="route-card" data-m="${id}" onclick="selectRoute('${id}')">
            <div class="route-card-icon">${icon}</div>
            <div class="route-card-name">${name}</div>
            <div class="route-card-km">${r.km} km</div>
            <div class="route-card-time">${r.tempo}</div>
            ${tollHtml}${savingHtml}
        </div>`;
    }
    el.innerHTML =
        card('veloce',    '⚡', 'Veloce',    _routes.veloce) +
        card('breve',     '📏', 'Breve',     _routes.breve) +
        card('economica', '💰', 'Economica', _routes.economica);
}

function selectRoute(mode) {
    if (!_routes[mode]) return;
    _selectedMode = mode;
    document.querySelectorAll('.route-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.m === mode));
    updateBtnStart();
}

function updateBtnStart() {
    document.getElementById('btnStart').disabled = !(_dest && _selectedMode && _routes[_selectedMode]);
}

// ── INIZIA NAVIGAZIONE ────────────────────────────────────────
function iniziaNavigazione() {
    if (!_dest || !_selectedMode || !_routes[_selectedMode]) return;
    _activeRoute = _routes[_selectedMode];
    _polyCoords  = _activeRoute.polyCoords;
    _maneuvers   = _activeRoute.actions;
    _curManIdx   = 0;
    _announced.clear();

    // Mostra screen nav
    document.getElementById('screenSetup').style.display = 'none';
    document.getElementById('screenNav').style.display = 'flex';

    // Label modalità
    document.getElementById('navModalitaLabel').textContent = _modalitaLabels[_selectedMode] || '';

    // Aggiorna banner con prima maneuver
    aggiornaManeuverBanner();

    // Avvia GPS ad alta precisione
    if (_watchId) navigator.geolocation.clearWatch(_watchId);
    _watchId = navigator.geolocation.watchPosition(onGPS, null, {
        enableHighAccuracy: true, maximumAge: 3000, timeout: 10000
    });

    // Init mappa Leaflet — distruggi sempre e ricrea per evitare tile duplicati
    setTimeout(() => {
        if (_navMap) { _navMap.remove(); _navMap = null; _truckMarker = null; _routeLayer = null; }
        _navMap = L.map('navMap', { zoomControl: true, attributionControl: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20, attribution: '© OSM'
        }).addTo(_navMap);
        _navMap.invalidateSize();

        // Disegna rotta
        if (_routeLayer) _navMap.removeLayer(_routeLayer);
        const colMap = { veloce:'#3498db', breve:'#27ae60', economica:'#f39c12' };
        if (_polyCoords.length > 0) {
            _routeLayer = L.polyline(_polyCoords, {
                color: colMap[_selectedMode] || '#E30613',
                weight: 6, opacity: 0.85
            }).addTo(_navMap);
            _navMap.fitBounds(_routeLayer.getBounds(), { padding: [40, 40] });
        } else if (_origin) {
            _navMap.setView([_origin.lat, _origin.lng], 13);
        }

        // Marker truck — usa _origin se disponibile, altrimenti _dest come posizione temporanea
        const startPos = _origin || _dest;
        const icon = L.divIcon({
            html: '<div class="truck-icon-wrap">🚛</div>',
            className: '', iconSize: [32, 32], iconAnchor: [16, 16]
        });
        if (startPos) {
            if (!_truckMarker) {
                _truckMarker = L.marker([startPos.lat, startPos.lng], { icon }).addTo(_navMap);
            } else {
                _truckMarker.setLatLng([startPos.lat, startPos.lng]);
            }
        }
    }, 50);

    // Ricalcolo automatico ogni 20 min
    if (_rerouteTimer) clearInterval(_rerouteTimer);
    _rerouteTimer = setInterval(forzaRicalcolo, 20 * 60 * 1000);
}

// ── GPS UPDATE ────────────────────────────────────────────────
function onGPS(pos) {
    const { latitude: lat, longitude: lng, speed } = pos.coords;
    _lastPos = { lat, lng };
    _origin  = { lat, lng };

    // Prima fix GPS dopo destinazione pronta ma senza rotte ancora → calcola ora
    const hasAnyRoute = Object.values(_routes).some(r => r !== null);
    if (_dest && !hasAnyRoute) { calc3Routes(); return; }

    // Se la navigazione non è ancora iniziata, usciamo qui
    if (!_truckMarker || !_navMap) return;

    // Aggiorna marker
    _truckMarker.setLatLng([lat, lng]);

    // Velocità
    const kmh = speed != null ? Math.round(speed * 3.6) : null;
    document.getElementById('speedVal').textContent = kmh ?? '—';

    // Distanza rimanente fino alla destinazione
    if (_polyCoords.length > 0) {
        const distRem = haversine(lat, lng, _dest.lat, _dest.lng);
        document.getElementById('distRemain').textContent = distRem > 1
            ? distRem.toFixed(1) + ' km al traguardo'
            : Math.round(distRem * 1000) + ' m al traguardo';
        const avgKmh = (kmh && kmh > 5) ? kmh : 70;
        const etaMins = Math.round((distRem / avgKmh) * 60);
        const etaDate = new Date(Date.now() + etaMins * 60000);
        document.getElementById('etaTime').textContent =
            etaDate.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
    }

    // Arrivati?
    if (_dest && haversine(lat, lng, _dest.lat, _dest.lng) < 0.05) {
        arrivoDestinazione();
        return;
    }

    aggiornaManeuverCorrente(lat, lng);
    _navMap.panTo([lat, lng], { animate: true, duration: 0.5 });
}

function aggiornaManeuverCorrente(lat, lng) {
    if (_maneuvers.length === 0) return;

    // Trova maneuver attiva: cerca la più vicina non ancora completata
    // Strategia: calcola distanza accumulata dalla posizione corrente sulla polyline
    let closestIdx = 0, minDist = Infinity;
    for (let i = 0; i < _polyCoords.length; i++) {
        const d = haversine(lat, lng, _polyCoords[i][0], _polyCoords[i][1]);
        if (d < minDist) { minDist = d; closestIdx = i; }
    }

    // Stima maneuver corrente basata sulla proporzione di polyline percorsa
    const progress = closestIdx / Math.max(_polyCoords.length - 1, 1);
    const manIdx = Math.min(Math.floor(progress * _maneuvers.length), _maneuvers.length - 1);
    if (manIdx !== _curManIdx) {
        _curManIdx = manIdx;
        aggiornaManeuverBanner();
    }

    // Distanza alla prossima maneuver
    const man = _maneuvers[_curManIdx];
    if (man && !_announced.has(_curManIdx)) {
        const distToNextKm = (man.length || 0) / 1000 * (1 - progress);
        if (distToNextKm < 0.3) {
            _announced.add(_curManIdx);
            annuncia(man.instruction);
        }
    }
}

function aggiornaManeuverBanner() {
    if (_maneuvers.length === 0) {
        document.getElementById('maneuverArrow').textContent = '↑';
        document.getElementById('maneuverInstruction').textContent = 'Navigazione attiva';
        document.getElementById('maneuverDist').textContent = '';
        document.getElementById('maneuverNext').textContent = '';
        return;
    }
    const man = _maneuvers[Math.min(_curManIdx, _maneuvers.length - 1)];
    const next = _maneuvers[_curManIdx + 1];

    document.getElementById('maneuverArrow').textContent = directionArrow(man.action, man.direction);
    document.getElementById('maneuverInstruction').textContent = man.instruction || 'Prosegui dritto';
    const distKm = (man.length || 0) / 1000;
    document.getElementById('maneuverDist').textContent =
        distKm > 1 ? `Tra ${distKm.toFixed(1)} km` : distKm > 0 ? `Tra ${Math.round(distKm * 1000)} m` : '';
    document.getElementById('maneuverNext').textContent = next ? `Poi: ${next.instruction}` : '';
}

function directionArrow(action, direction) {
    if (action === 'arrive') return '🏁';
    if (action === 'depart') return '▲';
    const map = {
        left:'←', right:'→', slightLeft:'↖', slightRight:'↗',
        sharpLeft:'↙', sharpRight:'↘', uTurnLeft:'↩', uTurnRight:'↪',
        straight:'↑', keepLeft:'↖', keepRight:'↗'
    };
    return map[direction] || '↑';
}

// ── HAVERSINE ─────────────────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── VOICE ─────────────────────────────────────────────────────
function annuncia(text) {
    if (!text || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'it-IT';
    utt.rate = 0.95;
    window.speechSynthesis.speak(utt);
}

// ── RICALCOLO ─────────────────────────────────────────────────
async function forzaRicalcolo() {
    if (!_dest || !_selectedMode || !_lastPos) return;
    showSpinner('Ricalcolo percorso...');
    try {
        const qs = [
            `apiKey=${HERE_KEY}`,
            `transportMode=truck`,
            `origin=${_lastPos.lat},${_lastPos.lng}`,
            `destination=${_dest.lat},${_dest.lng}`,
            `return=polyline,actions,summary`,
            `lang=it`,
            AVOID_CH,
            `vehicle[grossWeight]=${TRUCK.grossWeight}`,
            `vehicle[weightPerAxle]=${TRUCK.weightPerAxle}`,
            `vehicle[height]=${TRUCK.height}`,
            `vehicle[length]=${TRUCK.length}`,
            `vehicle[width]=${TRUCK.width}`,
            `vehicle[axleCount]=${TRUCK.axleCount}`,
            `vehicle[trailerCount]=${TRUCK.trailerCount}`,
            _selectedMode === 'economica' ? 'avoid[features]=tollRoad' : '',
            _selectedMode === 'breve' ? 'routingMode=short' : 'routingMode=fast',
        ].filter(Boolean);
        const resp = await fetch(HERE_ROUTE + '?' + qs.join('&'));
        const data = await resp.json();
        const route = parseRoute(data.routes?.[0]);
        if (route) {
            _activeRoute = route;
            _polyCoords  = route.polyCoords;
            _maneuvers   = route.actions;
            _curManIdx   = 0;
            _announced.clear();
            if (_routeLayer) _navMap.removeLayer(_routeLayer);
            const colMap = { veloce:'#3498db', breve:'#27ae60', economica:'#f39c12' };
            _routeLayer = L.polyline(_polyCoords, { color: colMap[_selectedMode] || '#E30613', weight: 6, opacity: 0.85 }).addTo(_navMap);
            aggiornaManeuverBanner();
            showToast('Percorso aggiornato');
        }
    } catch(e) { showToast('Errore ricalcolo'); }
    hideSpinner();
}

// ── ARRIVO ────────────────────────────────────────────────────
function arrivoDestinazione() {
    stopNavigazione(false);
    annuncia('Sei arrivato a destinazione!');
    document.getElementById('maneuverArrow').textContent = '🏁';
    document.getElementById('maneuverInstruction').textContent = 'Sei arrivato a destinazione!';
    document.getElementById('maneuverDist').textContent = '';
    document.getElementById('maneuverNext').textContent = '';
    document.getElementById('speedVal').textContent = '0';
    showToast('🏁 Destinazione raggiunta!');
}

// ── STOP ─────────────────────────────────────────────────────
function stopNavigazione(goBack = true) {
    if (_watchId)     { navigator.geolocation.clearWatch(_watchId); _watchId = null; }
    if (_rerouteTimer){ clearInterval(_rerouteTimer); _rerouteTimer = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (goBack) {
        document.getElementById('screenNav').style.display = 'none';
        document.getElementById('screenSetup').style.display = 'flex';
    }
}

window.addEventListener('beforeunload', () => {
    if (_watchId !== null) navigator.geolocation.clearWatch(_watchId);
    if (_rerouteTimer) clearInterval(_rerouteTimer);
});

// ── UI HELPERS ────────────────────────────────────────────────
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showSpinner(msg) {
    document.getElementById('spinnerText').textContent = msg || '...';
    document.getElementById('spinner').classList.add('show');
}
function hideSpinner() {
    document.getElementById('spinner').classList.remove('show');
}
let _toastTimer;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
